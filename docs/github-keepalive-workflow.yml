# Backup keep-alive: pings Supabase every 3 days so the free-tier project
# never pauses, independent of Vercel Cron. The publishable key is public
# by design (it ships in the browser bundle); RLS guards all data.
name: Supabase keep-alive

on:
  schedule:
    - cron: "30 4 */3 * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase REST API
        run: |
          code=$(curl -s -o /dev/null -w "%{http_code}" \
            "https://qzfuywofkncellzyagjy.supabase.co/rest/v1/reserved_usernames?select=username&limit=1" \
            -H "apikey: sb_publishable_P4CeqEOoxI2oqeOsOYIFsw_fIK3-QfC")
          echo "Supabase responded with HTTP $code"
          test "$code" = "200"
